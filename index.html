  --ink: var(--journal-ink);
  --accent: #5b664d;
  --muted: #675e50;
  --line: #d6c8b3;
}
body {
  color: var(--journal-ink);
  background: var(--journal-grain), #eae0cd;
}
header, #editor {
  background: var(--journal-grain), var(--journal-paper);
  border-color: var(--line);
}
header .brand {
  color: var(--journal-ink);
  font: 400 clamp(23px, 2.35vw, 30px)/1.1 var(--journal-hand);
  letter-spacing: 0;
}
.brand-mark {
  width: 29px;
  height: 30px;
  color: #fff7e2;
  background: var(--journal-rust);
  border-radius: 3px 2px 5px 2px;
  font: 400 21px/1 var(--journal-hand);
}
header .bar button, header .bar .button, .cover-open {
  color: var(--journal-ink);
  font: 400 22px/1.1 var(--journal-hand);

  background: var(--journal-grain), #fff9eb;
}
header .bar .flat { color: #6a5d4d; font-size: 13px; }
.cover-sheet { row-gap: clamp(22px, 3.5vw, 52px); }
.cover-sheet .cover-title {
  position: relative;
  min-width: 0;
  color: var(--journal-ink);
  font: 530 clamp(58px, 7.6vw, 119px)/.92 var(--journal-latin);
  letter-spacing: -.045em;
  transform: rotate(-3deg);
  width: fit-content;
  padding: 0 .09em .11em .03em;
}
.cover-title span { display: block; }
.cover-title span + span { margin: .045em 0 0 .38em; width: fit-content; position: relative; }
.cover-title span + span::after {
  content: "";
  display: block;
  width: 61%;
  margin: .075em 0 0 auto;
  height: .048em;
  background: #aa6950;
  opacity: .85;
  clip-path: polygon(0 83%, 18% 33%, 46% 5%, 77% 10%, 100% 48%, 84% 69%, 55% 64%, 26% 84%, 4% 100%);
}
.cover-open {
  border-color: #9b886d;
  margin-left: 3%;
  padding: 9px 17px 10px;
  font-size: 24px;
  box-shadow: 1px 3px 2px #70583f24;
  transform: rotate(-1deg);
}
.cover-open span { color: var(--journal-rust); }
.street-print {
  background: var(--journal-grain), #f9f0db;
  border: 1px solid #c6b99e;
  box-shadow: 1px 2px 1px #ae9b7b, 3px 8px 15px -5px #614a3052;
  padding: clamp(8px, .9vw, 14px);
  transform: rotate(2.5deg);
}
.street-print::before {
  content: "";
  position: absolute;
  width: 23%;
  height: clamp(16px, 2vw, 26px);
  top: -.7em;
  left: 15%;
  z-index: 1;
  background: repeating-linear-gradient(88deg,#91a28a4d 0 1px,transparent 1px 4px), #c7cbb1cf;
  clip-path: polygon(0 2%,99% 0,97% 18%,100% 39%,98% 63%,100% 82%,98% 100%,1% 97%,2% 81%,0 60%,2% 39%);
  transform: rotate(-7deg);
  pointer-events: none;
}
.street-image {
  position: relative;
  isolation: isolate;
  background: #eadabe;
  overflow: hidden;
  clip-path: polygon(0 .4%,12% 0,29% .25%,56% 0,70% .2%,95% 0,100% .3%,99.8% 21%,100% 49%,99.8% 87%,100% 99.8%,82% 100%,64% 99.6%,37% 100%,17% 99.7%,0 100%,.15% 77%,0 53%,.2% 29%);
}
.street-print[data-format="portrait"] { width: min(100%, 37svh, 330px); }
.street-print figcaption {
  padding: 10px 13% 3px 3px;
  color: var(--journal-ink);
  font: 400 clamp(22px, 2.3vw, 32px)/1.1 var(--journal-hand);
}
.street-print small { margin-top: 5px; }
#editor { border: 1px solid #b6a487; border-radius: 4px 8px 5px 4px; }
#editor h2 { font: 400 34px/1.2 var(--journal-hand); }
#editor input, #editor select, #editor textarea, #editor button { border-radius: 3px; border-color: #c3b69f; }
#editor .primary { background: #535f4e; border-color: #535f4e; }
@media (max-width: 700px) {
  .street-print[data-format="portrait"] { width: min(88%, 31svh, 250px); }
  .cover-sheet .cover-title { font-size: clamp(56px, 13vw, 81px); justify-self: center; }
  .cover-sheet { gap: clamp(21px, 3.8svh, 33px); }
  .cover-open { margin: 0; }
  .street-print figcaption { font-size: clamp(22px, 5.1vw, 27px); }
}

#mapPage.district-sheet {
  --map-stock: var(--journal-paper, #faf4e7);
  --map-ink: var(--journal-ink, #372e27);
  --map-hand: var(--journal-hand, "KaiTi", "Kaiti SC", cursive);
  --map-latin: var(--journal-latin, Georgia,var(--journal-hand));
  --map-rule: #bcb098;
  max-width: 1320px;
  min-height: calc(100svh - 62px);
  padding: clamp(16px, 3.6vw, 56px) clamp(14px, 4.6vw, 68px) 20px;
  color: var(--map-ink);
  background: transparent;
}
#mapPage .paint-book {
  position: relative;
  isolation: isolate;
  display: grid;
  grid-template-columns: minmax(0, 1.42fr) minmax(0, 1fr);
  grid-template-areas: "map title" "map index";
  align-content: center;
  align-items: start;
  column-gap: clamp(48px, 6vw, 84px);
  row-gap: 20px;
  padding: clamp(26px, 3.7vw, 52px) clamp(22px, 4.3vw, 58px) clamp(27px, 4vw, 54px);
  border: 1px solid #d4c6ad;
  border-radius: 9px 5px 12px 7px;
  background:
    linear-gradient(90deg, transparent 55.7%, #a28a6024 57%, #a28a6060 57.5%, #fff8e766 57.9%, transparent 59.3%),
    linear-gradient(105deg, #fffbef70, transparent 49%, #c4a67b0f),
    var(--journal-grain, none),
    var(--map-stock);
  box-shadow: 1px 2px #f1e8d6, 1px 3px #cbbba0, 2px 5px #f0e5d3, 2px 6px #cebea5, 0 12px 22px -12px #57453063;
}
#mapPage .paint-book::before {
  content: "";
  position: absolute;
  top: -8px;
  left: 10%;
  width: clamp(55px, 7vw, 86px);
  height: 24px;
  background: repeating-linear-gradient(90deg, #82937c3b 0 5px, #ffffff42 5px 10px), #b4b99b99;
  border-inline: 1px dashed #eee6d4;
  transform: rotate(-8deg);
  pointer-events: none;
}
#mapPage .paint-title {
  grid-area: title;
  align-self: end;
  margin: 0;
  color: var(--map-ink);
  font: 400 clamp(38px, 4.1vw, 58px)/1.2 var(--map-hand);
  text-align: left;
  letter-spacing: .025em;
  transform: rotate(-1.5deg);
}
#mapPage .paint-title i {
  display: block;
  margin: 3px 0 0 3px;
  color: #805c49;
  font: 400 clamp(19px, 2.15vw, 29px)/1.1 var(--map-latin);
  letter-spacing: .025em;
}
#mapPage .district-layout {
  grid-area: map;
  align-self: center;
  min-width: 0;
}
#mapPage #districtMap {
  display: block;
  width: 100%;
  height: auto;
  min-height: 0;
  max-height: 705px;
  aspect-ratio: 795 / 945;
  overflow: visible;
  background: transparent;
}
#mapPage .area path { stroke: var(--journal-sage, #68816c); stroke-width: 1.4; }
#mapPage .area:hover path,
#mapPage .area:focus-visible path { fill: #dab593; stroke: #8b533c; stroke-width: 3; }
#mapPage .ink-label {
  font: 400 29px var(--map-hand);
  fill: var(--map-ink);
  stroke: var(--map-stock);
  stroke-width: 3px;
  stroke-linejoin: round;
}
#mapPage .ink-label.roman {
  font: 400 20px var(--map-latin);
  fill: #514b3d;
  stroke-width: 2.6px;
}
#mapPage .ink-link:is(:hover,:focus-visible) text { fill: var(--journal-rust, #974c37); }
#mapPage .ink-link:is(:hover,:focus-visible) path { stroke: var(--journal-rust, #974c37); stroke-width: 2.5; }
#mapPage .paint-index { grid-area: index; min-width: 0; }
#mapPage .paint-index h2 {
  margin: 0 0 8px;
  color: #83543f;
  font: 400 clamp(21px, 2vw, 25px)/1.3 var(--map-hand);
}
#mapPage #districtIndex { display: grid; grid-template-columns: 1fr; gap: 0; }
#mapPage #districtIndex a {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
  min-height: 44px;
  padding: 8px 2px 5px;
  border: 0;
  color: var(--map-ink);
  font: 400 clamp(20px, 1.7vw, 24px)/1.3 var(--map-hand);
  text-decoration: none;
}
#mapPage #districtIndex a::after {
  content: "";
  flex: 1;
  min-width: 4px;
  margin-inline: 2px;
  border-bottom: 1px dotted var(--map-rule);
}
#mapPage #districtIndex small {
  order: 1;
  flex-shrink: 0;
  color: #5c5b4a;
  font: 14px/1.5 var(--journal-hand);
  font-variant-numeric: tabular-nums;
}
#mapPage #districtIndex a:is(:hover,:focus-visible) { color: #92482f; background: #cbb6861c; }
#mapPage > .bar { justify-content: space-between; gap: 12px; margin-top: 12px; }
#mapPage > .bar a { display: inline-flex; align-items: center; min-height: 44px; text-underline-offset: 4px; }
#mapPage > .bar a:first-child { color: #634937; font: 400 21px var(--map-hand); }
#mapPage > .bar .flat { color: #645b4b; font-size: 13px; }
@media (max-width: 920px) {
  #mapPage.district-sheet { padding: 20px max(12px,3vw) 12px; }
  #mapPage .paint-book {
    grid-template-columns: 1fr;
    grid-template-areas: "title" "map" "index";
    gap: 12px;
    padding: 27px clamp(12px, 4.2vw, 30px) 23px;
    background: linear-gradient(96deg, #c9b9991a, transparent 9%), var(--journal-grain, none), var(--map-stock);
  }
  #mapPage .paint-book::before { left: auto; right: 7%; transform: rotate(6deg); }
  #mapPage .paint-title { text-align: center; }
  #mapPage .paint-title i { display: inline; margin-left: 4px; font-size: .48em; }
  #mapPage #districtMap { max-height: 610px; }
  #mapPage .ink-label { font-size: 35px; }
  #mapPage .ink-label.roman { font-size: 24px; }
  #mapPage .paint-index { padding: 12px 1% 0; border-top: 1px solid #d9cdb6; }
  #mapPage #districtIndex { grid-template-columns: repeat(2,minmax(0,1fr)); column-gap: 9%; }
}

/* Album leaves and the postcard glued inside each district. */
#page .dish-study {
  position: relative;

  place-items: center;

}
#page .dish-study img {

#page.page {

#page .breadcrumb:hover { text-decoration: underline; text-underline-offset: 5px; }

#page .empty-state::before,

#page .walk .bar { gap: 7px; margin-top: 15px; }
#page .route-preview { border: 1px solid #c1b79f; border-radius: 2px; }
#page .badge { background: #ede1c5; color: #665040; }

@media (prefers-reduced-motion: reduce) {
  #page .card:hover, #page .card:focus-within, #page .card:active { transform: none; }
}

.guest-metal{position:absolute;top:-9px;left:12%;width:76%;height:32px;border:5px solid #272724;border-radius:7px;box-shadow:inset 0 2px 1px #b5b8ae,0 3px 1px #817c70;background:linear-gradient(#373735,#161614 52%,transparent 53%)}
.guest-cord{position:absolute;right:0;top:16px;width:81px;height:18px;transform:rotate(34deg);border-radius:12px;background:repeating-linear-gradient(99deg,#176eaa 0 3px,#438eca 4px 6px,#114875 7px 8px);box-shadow:1px 2px 2px #34281244}
.guest-cord:after{content:'';position:absolute;right:-9px;top:-3px;width:20px;height:25px;background:#444541;border-radius:4px}

.guest-grid strong{display:grid;place-items:center;font-weight:400}.guest-grid button{position:relative;text-align:right;padding:26px 4px 3px;font:12px/1.4 Georgia,serif;height:48px}
.guest-grid [aria-pressed=true]:before{content:attr(data-ink);position:absolute;inset:4px auto auto 8%;width:31px;height:31px;border:2px double var(--blue);border-radius:48% 52%;color:var(--blue);font:23px/30px var(--journal-hand);text-align:center;transform:rotate(-12deg);animation:guest-ink .22s ease-out}

.guest-slip{position:relative;text-align:left;padding:26px 20px 30px;overflow-wrap:anywhere;color:#3c322b;border-bottom:5px dotted #b8aa92}.guest-slip small,.guest-slip footer{font-size:15px}.guest-slip h2{color:var(--rouge);font:26px/1.2 var(--journal-hand);margin:12px 0}.guest-item{border-block:1px dashed #927e69;padding:9px 0}.guest-slip p{white-space:pre-wrap;line-height:1.65}.guest-slip footer{border-top:1px dashed #927e69;padding-top:8px}.guest-slip label{display:block;margin-top:16px}.guest-slip :is(input,textarea){display:block;width:100%;box-sizing:border-box;font:inherit;color:inherit;padding:5px;border:0;border-bottom:1px dotted #88745b;background:transparent;resize:vertical}.guest-printer .guest-slip{animation:guest-feed .58s cubic-bezier(.21,.7,.3,1)}
.guest-wall{max-width:960px;margin:auto;background:var(--journal-grain),#d5c9b6;border:6px ridge #8d7160;padding:0 clamp(12px,3vw,32px) 32px;min-height:210px}.guest-wall h1{width:fit-content;margin:18px auto 32px;background:#702c32;color:#fff2d2;border:3px double #c5a581;padding:4px 28px;font:30px var(--journal-hand);letter-spacing:.14em}.guest-rail{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:30px 18px;align-items:start}.guest-rail article:before{content:'';position:absolute;top:-9px;left:calc(50% - 18px);width:36px;height:16px;border:1px solid #786342;border-radius:4px 4px 1px 1px;background:linear-gradient(#a88958,#dbc69a 46%,#8b714c 55%,#bea77c);transform-origin:top}.fresh-ticket:before{animation:guest-clamp .35s ease-out}.guest-status{min-height:1.5em}

const $=id=>document.getElementById(id);

function mountCover(photos){
 let previous='';
 try{previous=localStorage.getItem('gz-last-cover');}catch{}
 const remaining=photos.filter(photo=>photo.id!==previous);
 const pool=remaining.length?remaining:photos;
 const photo=pool[Math.floor(Math.random()*pool.length)];

 $('coverPrint').dataset.format=photo.height>photo.width?'portrait':'landscape';
 image.width=photo.width;
 image.height=photo.height;
 image.alt=photo.alt;
 image.src=photo.src;
 $('streetCaption').textContent=photo.caption;
 try{localStorage.setItem('gz-last-cover',photo.id);}catch{}
}
mountCover(model.photos);
const preview=model.preview===true||location.protocol==='file:'||new URLSearchParams(location.search).get('sample')==='1';
const stations=new Map();
for(const line of model.lines)for(const stop of line.stops){
 if(!stations.has(stop.id))stations.set(stop.id,{...stop,lines:new Map()});
 stations.get(stop.id).lines.set(line.name,line.color);
}

function nearestStation(location, stationCoords){
 const [lng,lat]=String(location).split(',').map(Number);
 if(!Number.isFinite(lng)||!Number.isFinite(lat))return null;
 const radians=Math.PI/180;
 let nearest=null;
 for(const [id,value] of Object.entries(stationCoords)){
  const [x,y]=value.split(',').map(Number);
  const a=Math.sin((lat-y)*radians/2)**2+Math.cos(lat*radians)*Math.cos(y*radians)*Math.sin((lng-x)*radians/2)**2;
  const meters=12742000*Math.asin(Math.sqrt(Math.min(1,a)));
  if(!nearest||meters<nearest.meters)nearest={id,meters};
 }
 return nearest;
}
const all=[...stations.values()];
const districts=new Map(model.districts.map(d=>[d.id,d]));
function insideRing(x,y,ring){
 let inside=false;
 for(let i=0,j=ring.length-1;i<ring.length;j=i++){
  const [ax,ay]=ring[i],[bx,by]=ring[j];
  if((ay>y)!==(by>y)&&x<(bx-ax)*(y-ay)/(by-ay)+ax)inside=!inside;
 }
 return inside;
}
function districtOf(row){
 const [x,y]=String(row.coords).split(',').map(Number);
 const area=model.districts.find(d=>d.polygons.some(([outer,...holes])=>insideRing(x,y,outer)&&!holes.some(r=>insideRing(x,y,r))));
 return area||model.districts.find(d=>row.address?.includes(d.name));
}

}

 map.append(defs);

  labels.push(label);
  const entry=link(d.name,href);entry.append(node('small',count+' 家'));index.append(entry);
 }

function spineLuminance(hex){
 const channels=hex.match(/[0-9a-f]{2}/gi).map(value=>parseInt(value,16)/255).map(value=>value<=.04045?value/12.92:((value+.055)/1.055)**2.4);
 return channels[0]*.2126+channels[1]*.7152+channels[2]*.0722;
}
function spineCountColor(hex){
 const rgb=hex.match(/[0-9a-f]{2}/gi).map(value=>parseInt(value,16));
 for(let mix=.9;mix<=1.001;mix+=.025){
  const color='#'+rgb.map(value=>Math.round(value+(255-value)*Math.min(mix,1)).toString(16).padStart(2,'0')).join('');
  if((spineLuminance(color)+.05)/(spineLuminance(hex)+.05)>=7)return color;
 }
 return '#ffffff';
}

}

function albumView(page,total,mobile){
 const selected=Math.max(0,Math.min(total,page));
 if(mobile)return {start:selected,left:null,right:selected,last:total};
 const start=selected===0?0:2*Math.floor(selected/2);
 return {start,left:start,right:start+1<=total?start+1:null,last:2*Math.floor(total/2)};
}
function albumPageForEntry(index){return index<0?0:index+1;}
function albumStep(page,total,mobile,direction){
 const view=albumView(page,total,mobile);
 return Math.max(0,Math.min(view.last,view.start+(mobile?1:2)*direction));
}

 window.addEventListener('hashchange',()=>{
  if(scene.hidden)return;
  if(location.hash!=='#/tea'){closeScene();return;}
  const cup=document.querySelector('#littleCup');
  const origin=cup.getBoundingClientRect(),target=document.querySelector('#cupMark').getBoundingClientRect();
  landing=gsap.timeline({onComplete:()=>{closeScene();document.querySelector('#teaTitle').focus({preventScroll:true});}});
  if(!reduced()){
   landing.to('#pot',{x:90,opacity:0,duration:.35},0)
    .to('#pourWords',{opacity:0,duration:.18},0)
    .to(cup,{x:(target.left+target.width/2-origin.left-origin.width/2)*320/document.querySelector('.tea-art').clientWidth,y:(target.top+target.height/2-origin.top-origin.height/2)*320/document.querySelector('.tea-art').clientWidth,scale:target.width/origin.width,transformOrigin:'center',duration:.55,ease:'power2.inOut'},0);
  }
  landing.to(scene,{opacity:0,duration:reduced()?.15:.28},reduced()?0:.3);
 });
 const scores=[
  {beat:.67,notes:[60,64,67,71,69,67,64,62,57,60,64,67,65,64,62,59],bass:[36,41,33,43]},
  {beat:.52,notes:[74,0,81,78,76,0,74,71,69,74,0,76,78,0,81,74],bass:[50,57,52,50]},
  {beat:.41,notes:[67,71,74,71,69,72,76,72,67,71,74,79,76,74,71,69],bass:[43,45,40,38]}
 ];
 let ctx,voice,selected=-1,requestId=0,returnHash='#/shelf',returnScroll=0,confirming=false;
 try{const saved=sessionStorage.getItem('gz-tea');if(saved!==null&&['-1','0','1','2'].includes(saved))selected=Number(saved);}catch{}
 const pause=document.querySelector('#teaPause'),keys=[...menu.querySelectorAll('[data-tea]')];
 const receipt=document.querySelector('#teaReceipt'),confirm=document.querySelector('#teaConfirm');
 const names=['普洱 · 慢坐','铁观音 · 清韵','菊花茶 · 晴午'];
 function retire(v){
  if(!v)return;clearInterval(v.timer);
  const t=ctx.currentTime;v.bus.gain.cancelAndHoldAtTime?.(t);
  v.bus.gain.linearRampToValueAtTime(0,t+.8);
  setTimeout(()=>v.bus.disconnect(),1000);
 }
 function playPart(mode){
  const bus=ctx.createGain(),start=ctx.currentTime+.03,s=scores[mode];bus.connect(ctx.destination);
  bus.gain.setValueAtTime(0,start);bus.gain.linearRampToValueAtTime(.22,start+.8);
  let beat=0,next=start;
  function tone(note,time,length,partials,volume){
   if(!note)return;
   partials.forEach(([ratio,weight])=>{
    const osc=ctx.createOscillator(),amp=ctx.createGain();osc.frequency.value=440*Math.pow(2,(note-69)/12)*ratio;
    amp.gain.setValueAtTime(.0001,time);amp.gain.exponentialRampToValueAtTime(volume*weight,time+.009);
    amp.gain.exponentialRampToValueAtTime(.0001,time+length);osc.connect(amp);amp.connect(bus);
    osc.start(time);osc.stop(time+length+.02);osc.onended=()=>{osc.disconnect();amp.disconnect();};
   });
  }
  function schedule(){
   next=Math.max(next,ctx.currentTime);
   while(next<ctx.currentTime+.2){
    const n=s.notes[beat%16];
    tone(n,next,mode===1?.85:1.1,mode===1?[[1,1],[2.008,.5],[4.03,.19]]:[[1,1],[2,.38],[3,.18]],.22);
    if(beat%4===0)tone(s.bass[Math.floor(beat/4)%4],next,1.3,[[1,1],[2,.45],[3,.2]],.34);
    if(mode===1&&beat%4===2)tone(72,next,.07,[[1,1],[2.7,.5]],.13);
    if(mode===2&&beat%2===1){
     const len=Math.ceil(ctx.sampleRate*.085),buffer=ctx.createBuffer(1,len,ctx.sampleRate),samples=buffer.getChannelData(0);
     for(let i=0;i<len;i++)samples[i]=(Math.random()*2-1)*Math.exp(-6*i/len)*.055;
     const shaker=ctx.createBufferSource();shaker.buffer=buffer;shaker.connect(bus);shaker.start(next);shaker.onended=()=>shaker.disconnect();
    }
    beat++;next+=s.beat;
   }
  }
  schedule();return {bus,timer:setInterval(schedule,100)};
 }
 function sync(){
  keys.forEach((btn,i)=>btn.setAttribute('aria-pressed',String(i===selected)));
  confirm.disabled=selected<0;
  pause.hidden=true;
  document.querySelector('#receiptPause').textContent=voice?'暂停音乐':selected<0?'点一盅茶':'继续音乐';
  document.querySelector('#receiptName').textContent=selected<0?'清静席':names[selected];
  document.querySelector('#receiptStamp').textContent=selected<0?'清静':'已点';
  const icon=document.querySelector('#receiptIcon');icon.className='tea-sticker tea-'+selected;icon.hidden=selected<0;
  receipt.hidden=!location.hash||location.hash==='#/'||location.hash==='#/tea';
 }
 function save(){try{sessionStorage.setItem('gz-tea',String(selected));}catch{}}
 function stop(){requestId++;retire(voice);voice=null;sync();}
 async function choose(i){
  selected=i;save();sync();
  const id=++requestId;
  try{
   ctx??=new AudioContext();await ctx.resume();if(id!==requestId)return;
   const old=voice;voice=playPart(i);retire(old);sync();document.querySelector('#teaStatus').textContent='';
  }catch{document.querySelector('#teaStatus').textContent='音乐暂时无法播放，可以继续翻食记。';}
 }
 keys.forEach((btn,i)=>btn.onclick=()=>{choose(i);if(window.gsap&&!reduced())gsap.fromTo(btn.querySelector('.tea-sticker'),{y:-8,rotation:-3},{y:0,rotation:0,duration:.3});});
 function finish(quiet=false){
  if(confirming)return;confirming=true;
  if(quiet){stop();selected=-1;save();}
  const reveal=()=>{
   location.hash=returnHash;
   requestAnimationFrame(()=>{
    sync();window.scrollTo(0,returnScroll);
    if(window.gsap&&!reduced())gsap.fromTo('#receiptStamp',{scale:1.8,rotation:-18,opacity:0},{scale:1,rotation:-8,opacity:1,duration:.25,delay:.05});
    confirming=false;
   });
  };
  if(!quiet&&window.gsap&&!reduced()){
   receipt.hidden=false;
   const source=keys[selected].querySelector('.tea-sticker'),target=document.querySelector('#receiptIcon');
   const a=source.getBoundingClientRect(),b=target.getBoundingClientRect(),clone=source.cloneNode();
   Object.assign(clone.style,{position:'fixed',left:a.left+'px',top:a.top+'px',width:a.width+'px',height:a.height+'px',zIndex:120,pointerEvents:'none',margin:'0'});
   document.body.append(clone);
   gsap.to(clone,{x:b.left-a.left,y:b.top-a.top,scale:b.width/a.width,transformOrigin:'top left',duration:.6,ease:'power2.inOut',onComplete:()=>{clone.remove();reveal();}});
  }else reveal();
 }
 confirm.onclick=()=>finish();
 document.querySelector('#teaQuiet').onclick=()=>finish(true);
 document.querySelector('#receiptToggle').onclick=()=>{
  const panel=document.querySelector('#receiptActions');panel.hidden=!panel.hidden;
  document.querySelector('#receiptToggle').setAttribute('aria-expanded',String(!panel.hidden));
 };
 function change(){
  returnHash=location.hash||'#/shelf';returnScroll=window.scrollY;
  document.querySelector('#receiptActions').hidden=true;
  location.hash='/tea';
 }
 document.querySelector('#teaChange').onclick=change;
 document.querySelector('#receiptPause').onclick=()=>{if(voice)stop();else if(selected>=0)choose(selected);else change();};
 pause.onclick=stop;
 window.addEventListener('hashchange',()=>{sync();if(location.hash==='#/tea')document.querySelector('#teaTitle').focus({preventScroll:true});});
 document.addEventListener('journal-paper',()=>{
  if(!ctx||!voice||ctx.state!=='running')return;
  const length=Math.floor(ctx.sampleRate*.19),buffer=ctx.createBuffer(1,length,ctx.sampleRate);
  const values=buffer.getChannelData(0);
  for(let i=0;i<length;i++)values[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/length)*.018;
  const source=ctx.createBufferSource(),filter=ctx.createBiquadFilter();
  filter.type='bandpass';filter.frequency.value=1400;filter.Q.value=.55;
  source.buffer=buffer;source.connect(filter);filter.connect(ctx.destination);source.start();
  source.onended=()=>{source.disconnect();filter.disconnect();};
 });
 sync();
})();
</script><script>(() => {
 const shelf=document.querySelector('#bookShelf');
 const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
 const touch=()=>matchMedia('(hover:none), (pointer:coarse)').matches;
 let busy=false,armed=null,lastBook=null,flight=null;
 let expectedHash='',pendingReturn=false;
 const animations=new Set();
 function animate(element,frames,duration=400){
  if(!element)return Promise.resolve();
  const animation=element.animate(frames,{duration,easing:'cubic-bezier(.22,.61,.36,1)',fill:'forwards'});
  animations.add(animation);
  return animation.finished.catch(()=>{});
 }
 function clear(){
  for(const animation of animations)animation.cancel();
  animations.clear();flight?.remove();flight=null;
  shelf.querySelectorAll('.shelf-volume').forEach(book=>{book.style.opacity='';});
  busy=false;
 }
 function paper(){if(!reduce())document.dispatchEvent(new Event('journal-paper'));}
 function createFlight(book,rectangle){
  const wrapper=document.createElement('div');wrapper.className='stack-flight';
  const cloth=getComputedStyle(book).getPropertyValue('--cloth');
  wrapper.style.setProperty('--cloth',cloth);
  for(const name of ['--spine-accent','--count-ink','--spine-chinese','--spine-latin','--spine-font-style','--spine-weight']){
   wrapper.style.setProperty(name,getComputedStyle(book).getPropertyValue(name));
  }
  Object.assign(wrapper.style,{left:rectangle.left+'px',top:rectangle.top+'px',width:rectangle.width+'px',height:rectangle.height+'px'});
  const spine=book.cloneNode(true);spine.removeAttribute('href');spine.removeAttribute('aria-label');spine.removeAttribute('data-district');spine.tabIndex=-1;spine.setAttribute('aria-hidden','true');
  const originals=[book,...book.querySelectorAll('*')],copies=[spine,...spine.querySelectorAll('*')];
  originals.forEach((original,index)=>{
   const style=getComputedStyle(original);
   const properties=['display','position','inset','left','right','top','bottom','width','height','min-width','min-height','max-width','max-height','padding','margin','gap','flex','flex-direction','align-items','justify-content','background','border','border-radius','outline','outline-offset','box-shadow','color','font','transform','transform-origin','opacity','box-sizing','clip-path','writing-mode','white-space','scale','z-index'];
   copies[index].style.cssText=properties.map(key=>key+':'+style.getPropertyValue(key)+';').join('');
  });
  Object.assign(spine.style,{position:'absolute',inset:'0',width:'100%',height:'100%',margin:'0',transform:'none',transition:'none'});
  const cover=document.createElement('div');cover.className='stack-cover';
  cover.dataset.label=book.dataset.label;
  const design=bookSpineDesigns[book.dataset.district];
  cover.append(spinePattern(design.pattern),book.querySelector('.book-label').cloneNode(true));
  for(const item of design.decorations.filter(item=>item!=='bookmark'))cover.append(spineDecoration(item));
  spine.querySelectorAll('[id]').forEach((element,index)=>{const old=element.id,newId=old+'-flight-'+index;spine.innerHTML=spine.innerHTML.replaceAll(old,newId);});

  const coverWidth=Math.min(340,innerWidth*.72),coverHeight=Math.min(440,innerHeight*.72);
  Object.assign(cover.style,{width:coverWidth+'px',height:coverHeight+'px',opacity:'0'});
  wrapper.append(spine,cover);wrapper.setAttribute('aria-hidden','true');document.body.append(wrapper);flight=wrapper;
  return {wrapper,spine,cover,coverWidth,coverHeight};
 }
 async function open(book){
  if(busy)return;
  busy=true;armed=null;book.classList.remove('is-armed');
  const hash=book.getAttribute('href'),rect=book.getBoundingClientRect();
  lastBook={id:book.dataset.district,hash,shelfScroll:scrollY,angle:Math.random()*10-5};
  paper();
  if(reduce()){
   await animate(shelf,[{opacity:1},{opacity:0}],140);
   expectedHash=hash;location.hash=hash;
   clear();return;
  }
  const elements=[...shelf.querySelectorAll('.shelf-volume')],index=elements.indexOf(book);
  const {wrapper,spine,cover,coverWidth,coverHeight}=createFlight(book,rect);
  book.style.opacity='0';
  const pulled=rect.width*.6;
  const x=(innerWidth-coverWidth)/2-rect.left,y=(innerHeight-coverHeight)/2-rect.top;
  lastBook.cover={width:coverWidth,height:coverHeight};
  for(const above of elements.slice(0,index)){
   const transform=getComputedStyle(above).transform;
   animate(above,[{transform},{transform:'translateY(4px) '+transform}],500);
  }
  await animate(wrapper,[{transform:'translateX(0)'},{transform:'translateX('+pulled+'px) rotate('+lastBook.angle+'deg)'}],500);
  if(!busy)return;
  for(const other of elements.filter(item=>item!==book)){
   const transform=getComputedStyle(other).transform;
   animate(other,[{opacity:1,transform},{opacity:0,transform:'translateY(12px) '+transform}],300);
  }
  const start='translate('+pulled+'px,0) rotate('+(-90+lastBook.angle)+'deg) scale(.35)';
  await Promise.all([
   animate(spine,[{opacity:1},{opacity:0}],220),
   animate(cover,[{opacity:0,transform:start},{opacity:1,transform:'translate('+x+'px,'+y+'px) rotate(0deg) scale(1)'}],500)
  ]);
  if(!busy)return;
  expectedHash=hash;location.hash=hash;
  await animate(wrapper,[{opacity:1},{opacity:0}],220);
  clear();
 }
 async function returnBook(){
  const book=shelf.querySelector('[data-district="'+lastBook.id+'"]');
  if(!book){clear();return;}
  busy=true;paper();
  if(reduce()){await animate(shelf,[{opacity:0},{opacity:1}],140);clear();book.focus({preventScroll:true});return;}
  const rect=book.getBoundingClientRect();
  const {wrapper,spine,cover,coverWidth,coverHeight}=createFlight(book,rect);
  const x=(innerWidth-coverWidth)/2-rect.left,y=(innerHeight-coverHeight)/2-rect.top,pulled=rect.width*.6;
  const others=[...shelf.querySelectorAll('.shelf-volume')].filter(item=>item!==book);
  book.style.opacity='0';spine.style.opacity='0';
  await animate(cover,[{opacity:1,transform:'translate('+x+'px,'+y+'px) scale(1)'},{opacity:0,transform:'translate('+pulled+'px,0) rotate('+(-90+lastBook.angle)+'deg) scale(.35)'}],450);
  await Promise.all([
   animate(spine,[{opacity:0,transform:'translateX('+pulled+'px) rotate('+lastBook.angle+'deg)'},{opacity:1,transform:'translateX(0) rotate(0deg)'}],400),
   ...others.map(other=>{const t=getComputedStyle(other).transform;return animate(other,[{opacity:.2,transform:'translateY(10px) '+t},{opacity:1,transform:t}],400);})
  ]);
  clear();book.focus({preventScroll:true});
 }
 document.addEventListener('click',event=>{
  const link=event.target.closest('a');
  if(!link||event.defaultPrevented||event.ctrlKey||event.metaKey||event.shiftKey||event.altKey||event.button!==0)return;
  if(link.matches('#bookShelf .shelf-volume')){
   event.preventDefault();if(busy)return;
   if(touch()&&event.detail!==0&&armed!==link){
    armed?.classList.remove('is-armed');armed=link;link.classList.add('is-armed');return;
   }
   open(link);return;
  }
  if(armed){armed.classList.remove('is-armed');armed=null;}
  if(link.getAttribute('href')==='#/shelf'&&lastBook&&location.hash.startsWith('#/district/')){
   pendingReturn=true;
  }
 });
 window.addEventListener('hashchange',event=>{
  const previous=new URL(event.oldURL).hash;
  if(expectedHash===location.hash){expectedHash='';return;}
  if(busy)clear();
  if(location.hash==='#/shelf'&&lastBook&&(pendingReturn||previous.startsWith('#/district/'))){
   pendingReturn=false;
   requestAnimationFrame(()=>{
    if(location.hash!=='#/shelf')return;
    window.scrollTo(0,lastBook.shelfScroll);returnBook();
   });
  }
 });
 window.addEventListener('pagehide',clear);
})();
